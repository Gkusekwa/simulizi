# Port plan (host ports already taken on the NAS: 3000 familia-api, 3001 flowengine-api,
# 3002 flowengine-web, 3006 hazina, 3007 kikoba, 5050 pgadmin, 8080 familia-web,
# 9000/8000/9444 portainer, 9100/9101 rustfs, 9443/9999 UGREEN UI, 5432/6379 native):
#   web (nginx, SPA + /api proxy)  -> host ${WEB_PORT:-3008}, public simulizi.tzcom.cloud
#   api                            -> internal only (expose 3000), reached via web's /api proxy

services: {}
