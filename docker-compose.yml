# Simulizi -- Docker stack for the NAS (Portainer git stack 30).
#
# Storage: Postgres and RustFS are centrally managed by the `infrastructure`
# stack (repo nasinfra) and reached over the external `nasinfra` network:
#   - database: role + database `simulizi` in the shared Postgres 18
#   - media:    bucket `simulizi` in the shared RustFS (S3 at minio:9000): audio narration
#   - jobs:     the release sweep runs inside the API (one process, one minute)
#
# Ports (see .claude/CLAUDE.md port map): web 3008 -> simulizi.tzcom.cloud,
# api 3009 -> simulizi-api.tzcom.cloud. Every service has an explicit restart:,
# healthchecks probe 127.0.0.1, and nothing uses a relative bind mount.

services:
  api:
    build: ./api
    container_name: simulizi-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      # Shared Postgres; DB_PASSWORD must equal nasinfra's SIMULIZI_PASSWORD.
      DATABASE_URL: postgresql://simulizi:${DB_PASSWORD:?DB_PASSWORD must be nasinfra's SIMULIZI_PASSWORD}@postgres:5432/simulizi
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      # The web app is on another hostname and calls the API cross-origin.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://simulizi.tzcom.cloud}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://simulizi.tzcom.cloud}
      # Email: nasinfra's Mailpit by default; point SMTP_HOST/PORT at a real
      # provider (Brevo/Resend, chosen in sprint 1) to send to readers.
      SMTP_URL: smtp://${SMTP_HOST:-mailpit}:${SMTP_PORT:-1025}
      MAIL_FROM: ${SMTP_FROM:-Simulizi <no-reply@simulizi.tzcom.cloud>}
      # Seeded accounts: promote or create on boot. Empty email = off. The
      # password is only used when the account does not exist yet.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MODERATOR_EMAIL: ${MODERATOR_EMAIL:-}
      MODERATOR_PASSWORD: ${MODERATOR_PASSWORD:-}
      # Media (audio narration) in the shared RustFS bucket. Internal endpoint
      # for uploads; readers get presigned URLs on the public endpoint.
      S3_ENDPOINT: ${S3_ENDPOINT:-minio}
      S3_PORT: ${S3_PORT:-9000}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-simulizi}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-storage.tzcom.cloud}
      S3_PUBLIC_PORT: ${S3_PUBLIC_PORT:-443}
      S3_PUBLIC_USE_SSL: ${S3_PUBLIC_USE_SSL:-true}
    networks:
      - default
      - nasinfra
    ports:
      - "${API_PORT:-3009}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Prisma migrations run before the server starts.
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: ./web
      args:
        # Baked into the bundle at build time; change it -> rebuild.
        VITE_API_URL: ${PUBLIC_API_URL:-https://simulizi-api.tzcom.cloud}/api
    container_name: simulizi-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3008}:80"
    healthcheck:
      # 127.0.0.1, never localhost: nginx here listens on IPv4 only.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  # Created by the nasinfra stack, which must be deployed first.
  nasinfra:
    external: true
    name: nasinfra
