# Simulizi -- Docker stack for the NAS.
# Empty for now: no code yet (see README.md). Services are added here as they exist.
#
# Storage (owner decision 2026-11-10): Postgres and RustFS are centrally managed by the
# `infrastructure` stack (repo nasinfra) and reached over the external `nasinfra` network:
#   - database: own role + database `simulizi` in the shared Postgres 18
#     (add `simulizi` to nasinfra APP_DATABASES and set SIMULIZI_PASSWORD; db-provision does the rest)
#   - media:    bucket `simulizi` in the shared RustFS (S3 API at minio:9000, public via
#     storage.tzcom.cloud, presigned URLs) -- not Cloudflare R2
#   - jobs:     BullMQ on the shared Redis; RabbitMQ is not used
#
# Port plan (host ports already taken on the NAS: 3000 familia-api, 3001 flowengine-api,
# 3002 flowengine-web, 3006 hazina, 3007 kikoba, 5050 pgadmin, 8080 familia-web,
# 9000/8000/9444 portainer, 9100/9101 rustfs, 9443/9999 UGREEN UI, 5432/6379 native):
#   web (nginx, SPA)              -> host ${WEB_PORT:-3008}, public simulizi.tzcom.cloud
#   api (NestJS, listens on 3000) -> host ${API_PORT:-3009}, public simulizi-api.tzcom.cloud
# Decision 2026-11-10: the API has its own hostname (familia pattern) because the Flutter app
# talks to it directly; web calls it cross-origin, so the API must set CORS_ORIGINS to
# https://simulizi.tzcom.cloud. Cloudflare ingress: simulizi -> http://<nas>:3008,
# simulizi-api -> http://<nas>:3009.

services: {}
