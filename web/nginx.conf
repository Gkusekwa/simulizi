server {
  # IPv4 only is deliberate: the container healthcheck probes 127.0.0.1.
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets are immutable; Cloudflare may cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA fallback: serve index.html for client-side routes. Never cache the shell
  # for long, or a deploy would strand readers on an old bundle.
  location / {
    add_header Cache-Control "public, max-age=60";
    try_files $uri $uri/ /index.html;
  }
}
